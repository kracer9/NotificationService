services:
  app:
    build:
      context: .
    container_name: notification_app
    working_dir: /var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_DATABASE=${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./project:/var/www
    depends_on:
      - redis
      - postgres
      - rabbitmq

  nginx:
    image: nginx:latest
    container_name: notification_nginx
    volumes:
      - ./project:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${APP_PORT}:80
    depends_on:
      - app

  redis:
    image: redis:8.6.3
    container_name: notification_redis
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_LIMIT_MEMORY}

  postgres:
    image: postgres:18.4
    container_name: notification_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.0-management
    hostname: rabbitmq
    container_name: notification_rabbitmq
    restart: always
    ports:
      - ${RABBITMQ_PORT}:15672
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
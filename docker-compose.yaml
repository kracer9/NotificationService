services:
  app:
    build:
      context: .
      target: ${APP_TARGET}
    container_name: notification_app
    env_file: ./.env
    volumes:
      - ./project:/var/www
    depends_on:
      - redis
      - postgres
      - rabbitmq

  high_priority_worker:
    build:
      context: .
      target: ${APP_TARGET}
    container_name: notification_high_priority_worker
    command: php artisan queue:work --queue=high_priority
    env_file: ./.env
    volumes:
      - ./project:/var/www
    depends_on:
      - postgres
      - rabbitmq

  low_priority_worker:
    build:
      context: .
      target: ${APP_TARGET}
    container_name: notification_low_priority_worker
    command: php artisan queue:work --queue=low_priority
    env_file: ./.env
    volumes:
      - ./project:/var/www
    depends_on:
      - postgres
      - rabbitmq

  nginx:
    image: nginx:latest
    container_name: notification_nginx
    env_file: ./.env
    volumes:
      - ./project:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${APP_PORT}:80
    depends_on:
      - app

  redis:
    image: redis:8.6.3
    container_name: notification_redis
    env_file: ./.env
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_LIMIT_MEMORY}

  postgres:
    image: postgres:18.4
    container_name: notification_postgres
    env_file: ./.env
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.0-management
    hostname: rabbitmq
    container_name: notification_rabbitmq
    restart: always
    env_file: ./.env
    ports:
      - ${RABBITMQ_PORT}:5672
      - ${RABBITMQ_WEB_PORT}:15672
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
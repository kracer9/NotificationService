services:
  postgres:
    image: postgres:18.4
    container_name: notification_postgres
    env_file: ../../.env
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ../../data/postgres:/var/lib/postgresql